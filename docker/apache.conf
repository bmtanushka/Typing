<VirtualHost *:${PORT}>
    DocumentRoot /var/www/keyquest/public_html

    <Directory /var/www/keyquest/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Everything outside the web root stays private.
    <Directory /var/www/keyquest>
        AllowOverride None
    </Directory>

    # Railway terminates TLS at its proxy; trust its scheme header.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
